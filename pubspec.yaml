name: eazy_school_360
description: A multi-tenant school management system.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4
  
  # State Management
  flutter_riverpod: ^2.3.7
  
  # Navigation
  go_router: ^17.0.0
  
  # UI
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  intl: ^0.20.2
  
  # Forms and Validation
  form_builder_validators: ^11.2.0
  flutter_form_builder: ^10.1.0
  
  # Storage
  shared_preferences: ^2.2.0
  path_provider: ^2.1.1
  flutter_secure_storage: ^9.2.2
  
  # Utils
  uuid: ^4.5.2
  logger: ^2.0.1
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  file_picker: ^10.3.7
  pdf: ^3.10.4
  printing: ^5.11.0
  syncfusion_flutter_calendar: ^31.1.19
  syncfusion_flutter_charts: ^31.1.19
  syncfusion_flutter_pdfviewer: ^31.1.19
  
  # Responsive
  responsive_framework: ^1.1.0
  
  # Date/Time
  table_calendar: ^3.0.9
  
  # CSV/Excel parsing
  csv: ^6.0.0
  excel: ^4.0.6
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  freezed: ^3.2.3
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

